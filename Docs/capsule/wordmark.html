<!doctype html><html><head><meta charset="utf-8">
<!--
  Hollow Siege wordmark.

  Flat, one colour, no gradient, no outline, no ornament. The only idea in it
  is the weight contrast: HOLLOW set light and open, SIEGE set black and tight.
  That reads as the two halves of the title rather than as decoration, and it
  is the thing that survives being shrunk to 231px.

  What it deliberately is NOT: a vertical gold gradient with a heavy black
  keyline and a drop shadow and an ornamental divider. That combination is the
  default Photoshop layer style for fantasy logos and it reads as a free asset
  pack, which is exactly how the first attempt came out.

  Render:
    chrome --headless --hide-scrollbars --default-background-color=00000000 \
           --window-size=3000,560 --screenshot=out.png file://.../wordmark.html
-->
<style>
@font-face{font-family:'Cinzel';font-weight:400;
  src:url('file:///home/user/MegaBonk/Assets/DownloadedFonts/Cinzel/static/Cinzel-Regular.ttf');}
@font-face{font-family:'Cinzel';font-weight:900;
  src:url('file:///home/user/MegaBonk/Assets/DownloadedFonts/Cinzel/static/Cinzel-Black.ttf');}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
.wrap{width:3000px;height:560px;display:flex;align-items:center;justify-content:center}
.mark{font-family:'Cinzel';font-size:268px;line-height:1.02;white-space:nowrap;
  color:#ece6d8;
  /* Just enough shadow to hold over a bright valley. Not a style, a necessity. */
  filter:drop-shadow(0 6px 22px rgba(0,0,0,.62)) drop-shadow(0 1px 3px rgba(0,0,0,.5));}
.mark .l{font-weight:400;letter-spacing:.145em}
.mark .h{font-weight:900;letter-spacing:.045em}
</style></head><body>
<div class="wrap"><div class="mark"><span class="l">HOLLOW</span> <span class="h">SIEGE</span></div></div>
</body></html>
